    <script src="https://cdn.tailwindcss.com"></script>

<body class="bg-slate-300 text-slate-800 font-sans text-white">

    <header class="sticky top-0 z-30 bg-blue-900 backdrop-blur-md">
        <div class="flex items-center justify-between h-16 max-w-6xl px-4">
            <h1 class="text-2xl font-black">Mi Tienda</h1>
            <nav class="flex gap-6 font-medium text-sm">
                <a href="#">Inicio</a>
                <a href="#">Productos</a>
                <a href="#">Contacto</a>
            </nav>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 py-12">

            <p class="text-slate-500 mt-2 text-sm">Este es nuestro catálogo de productos</p>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="contenedor-productos">
        </div>

    </main>

    <input type="checkbox" class="peer hidden" id="carrito-toggle">

    <label for="carrito-toggle" class="fixed bottom-6 bg-blue-800 p-4 right-6 cursor-pointer z-40 transition-all hover:scale-110 active:scale-95">
        Carrito
        <span id="carrito-badge" class="absolute -top-1 -right-1 bg-red-500 p-1">1</span>
    </label>

    <label for="carrito-toggle" class="fixed inset-0 bg-slate-900/60 backdrop-blur z-40 opacity-0 pointer-events-none peer-checked:opacity-100 peer-checked:pointer-events-auto transition-opacity duration-300"></label>

    <aside class="fixed top-0 right-0 w-full max-w-md h-full bg-white z-50 shadow-2xl transform translate-x-full peer-checked:translate-x-0 transition-transform duration-300 ease-in-out flex flex-col justify-between p-6">
        <h3>Carrito</h3>
        <div id="carrito-items" class="text-slate-400 ">

        </div>
        <button onclick="hablarWhatsapp()" class="w-full bg-green-600 py-4 px-2 rounded">

    </aside>

            {
                id: 10,
                nombre: "Audífonos Bluetooth",
                descripcion: "Audífonos inalámbricos compactos con estuche de carga",
                precio: 32990,
                imagen: "https://placehold.co/600x400/880E4F/FFFFFF?text=Audifonos+Bluetooth",

            {
                id: 11,
                nombre: "Zapatos para Damas",
                descripcion: "Zapatos para damas compactos con taco alto",
                precio: 78990,
                imagen: "https://placehold.co/600x400/FF0080/FFFFFF?text=Zapatos+Damas",
                destacado: true
            }
        ];

        let tarjetasProductos = "";

        for(let i = 0; i < productos.length; i++){

            tarjetasProductos = tarjetasProductos + `
            <div class="bg-white rounded-2xl shadow-sm hover:shadow-xl border border-slate-100 group">
                <div class="relative overflow-hidden bg-slate-100">
                    <img 
                        src="${productos[i].imagen}" 
                        alt="" 
                        class="w-full h-56 object-cover group-hover:scale-105 transition-transform duration-500"
                    >
                ${productos[i].destacado?'<span class="absolute top-3 right-3 bg-indigo-600 text-white px-3 rounded-full">Nuevo</span>':''}
                </div>
                <div class="p-6 space-y-4">
                    <div>
                        <h3 class="text-slate-900 font-bold text-lg">${productos[i].nombre}</h3>
                        <p class="text-slate-500 text-sm mt-1">${productos[i].descripcion}</p>
                    </div>

                    <div class="flex items-center justify-between">
                        <span class="text-2xl font-black text-slate-900">${productos[i].precio} CLP</span>
                        <button class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium px-4 py-2.5 rounded-xl transition-all active:scale-95 shadow-md" onclick='agregarCarrito(${JSON.stringify(productos[i])})'>+ Añadir</button>
                    </div>
                </div>
            </div>
            `;
        }

        document.getElementById("contenedor-productos").innerHTML = tarjetasProductos;

        let carrito = [];
        function agregarCarrito(prod){
            console.log(prod);
            carrito.push({id: prod.id, nombre: prod.nombre, precio: prod.precio, cantidad: 1, imagen: prod.imagen});
            document.getElementById("carrito-badge").innerHTML = carrito.length;
            actualizarCarrito();
            document.getElementById('carrito-toggle').checked = true;
        }

        let carritoHtml = "";
        function actualizarCarrito() {
            carritoHtml = carrito.map(item => `
            <div class="flex items-center justify-between gap-4 bg-slate-50 p-3 rounded-md border border-slate-500">
                <img src="${item.imagen}" alt="" class="w-14 h-14 object-cover rounded shadow-md">
                <div class="flex-1">
                    <h4 class="font-semibold text-slate-800">${item.nombre}</h4>
                    <span class="text-indigo-600 font-medium text-xs">${item.precio} CLP</span>
                </div>
                <div>
                    <span>precio</span>
                </div>
            </div>
            `).join('');

            document.getElementById("carrito-items").innerHTML = carritoHtml;
        }

        function hablarWhatsapp() {
            let mensaje = '';

            carrito.forEach(item => {
                mensaje += `- *${item.nombre}* x ${item.cantidad} - $${item.precio}`;
            });

            window.open(`https://wa.me/56968445800?text=Hola+Quiero+comprar+${mensaje}`);
        }
